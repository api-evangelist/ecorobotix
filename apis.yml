aid: ecorobotix
name: Ecorobotix
description: 'Ecorobotix SA is a Swiss agricultural technology company founded in 2011
  and headquartered in Yverdon-les-Bains, Switzerland, building AI-driven ultra-high-precision
  (UHP) crop-care equipment. Its flagship ARA smart sprayer combines Plant-by-Plant
  AI detection with UHP-Spray-Technology to scan a field, classify crops versus weeds
  in under 250 milliseconds, and place treatment on a roughly six-by-six centimetre
  target, cutting herbicide and plant-protection input volumes by up to 95 percent
  compared with broadcast spraying. The product family spans the ARA620 and ARA595
  UHP sprayers for row and vegetable crops, the ALBA UHP sprayer for turf, and a
  library of crop-specific algorithms for broccoli, carrots, onions and chicory. More
  than 1,000 ARA units have been deployed across Europe, the United Kingdom, North
  America, South America and Australia/New Zealand. Machine telemetry, treatment maps
  and fleet data are delivered to customers through the Ecorobotix cloud portal, which
  is backed by an authenticated REST API; that API is not offered as a public developer
  program.'
