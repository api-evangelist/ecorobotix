apis:
- aid: ecorobotix-portal-api
  name: Ecorobotix Portal API
  description: 'The authenticated REST API behind the Ecorobotix cloud portal at
    portal.ecorobotix.cloud, which customers use to manage ARA sprayer fleets,
    treatment jobs and field data. The service is a Django REST Framework
    application that publishes a drf-spectacular OpenAPI schema at /api/schema/ and
    a Swagger UI at /api/schema/swagger-ui/, but both endpoints return HTTP 401
    ("Authentication credentials were not provided.") to anonymous clients, and
    every other /api/ path 302-redirects to /auth/login/. There is no public
    developer portal, no published API reference and no signup path for API access;
    the surface is customer-only.'
  humanURL: https://portal.ecorobotix.cloud/
  baseURL: https://portal.ecorobotix.cloud/api/
